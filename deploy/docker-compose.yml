# HMS production stack. Usage (from this directory):
#   cp .env.example .env && edit .env
#   docker compose up -d --build
#   docker compose exec api hms-entrypoint cli bootstrap --org ... (first install)
# `migrate` runs before the API at every start (migrations, database roles).
name: hms

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hms
      POSTGRES_DB: hms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  # Schema migrations, database roles and system role permissions. The only
  # service holding the schema owner's password; it exits when done.
  migrate:
    # Same image as the API (built from the same context, layers shared).
    build: ../backend
    command: ["migrate"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      HMS_ENV: production
      HMS_MIGRATION_DATABASE_URL: postgresql+asyncpg://hms:${POSTGRES_PASSWORD}@db:5432/hms
      # Read by `hms db-roles` to create/update the API's role (name, password).
      HMS_DATABASE_URL: postgresql+asyncpg://hms_api:${HMS_DB_APP_PASSWORD}@db:5432/hms
      HMS_DATA_KEY: ${HMS_DATA_KEY:?set HMS_DATA_KEY in .env}
    networks: [internal]

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      HMS_ENV: production
      # Least-privilege role: row-level security and append-only grants apply.
      HMS_DATABASE_URL: postgresql+asyncpg://hms_api:${HMS_DB_APP_PASSWORD:?set HMS_DB_APP_PASSWORD in .env}@db:5432/hms
      HMS_DATA_KEY: ${HMS_DATA_KEY:?set HMS_DATA_KEY in .env}
      HMS_COOKIE_SECURE: "true"
      HMS_ENABLE_DOCS: ${HMS_ENABLE_DOCS:-false}
      HMS_WORKERS: ${HMS_WORKERS:-2}
      HMS_SESSION_IDLE_MINUTES: ${HMS_SESSION_IDLE_MINUTES:-720}
      HMS_LOGIN_RATE_PER_MINUTE: ${HMS_LOGIN_RATE_PER_MINUTE:-20}
      HMS_BACKUP_CONTROL_DIR: /app/var/backup-control
    volumes:
      - media:/app/var/media
      # Status written by the backup service; the API only adds requests.
      - backup_control:/app/var/backup-control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      HMS_SITE_ADDRESS: ${HMS_SITE_ADDRESS:-:443}
      HMS_TLS: ${HMS_TLS:-internal}
      HMS_TRUSTED_PROXIES: ${HMS_TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "${HMS_HTTP_PORT:-80}:80"
      - "${HMS_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  # Scheduled verified backups, and the backups/restores requested from the
  # Backups screen (through the backup_control volume; no Docker access).
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: hms
      PGDATABASE: hms
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      HMS_API_UID: "10001"
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - backup_control:/control
    networks: [internal]

volumes:
  pgdata:
  media:
  backup_control:
  caddy_data:
  caddy_config:

networks:
  internal:
