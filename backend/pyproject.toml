[project]
name = "hms-backend"
version = "0.1.0"
description = "Hotel Management System — central API server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "pyotp>=2.9",
  "python-multipart>=0.0.17",
  "tzdata>=2024.2",
  "pillow>=11.0",
  # Billing documents: PDF rendering (Pango/HarfBuzz shaping for Khmer and
  # Chinese), templates, CLDR number/date formatting in 5 languages.
  "weasyprint>=70",
  "jinja2>=3.1",
  "babel>=2.16",
  # Channel manager: HTTPS client for provider APIs, and an XML parser that
  # refuses entity expansion and external references (untrusted XML).
  "httpx>=0.28",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "pypdf>=5.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "UP046", "UP047", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"migrations/*" = ["E501"]
# Load-test tool: random choices are workload, not security; fixed test password.
"loadtest/*" = ["S311", "S105", "E501", "ASYNC240"]
