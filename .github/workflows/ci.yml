name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms_dev_password
          POSTGRES_DB: hms
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U hms" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: PDF rendering libraries and fonts (Khmer, Chinese)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core fonts-noto-cjk
      - run: pip install -e '.[dev]' pip-audit
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: pytest -q
      - run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hms-api backend
      - run: docker build -f deploy/caddy/Dockerfile -t hms-web .
      - name: Validate Caddyfile
        run: docker run --rm -e HMS_SITE_ADDRESS=https://hms.lan -e HMS_TLS=internal hms-web caddy validate --config /etc/caddy/Caddyfile
