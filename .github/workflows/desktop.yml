name: Desktop

# The desktop shell (Tauri 2): tests, then installers for Linux (AppImage, DEB)
# and Windows (NSIS installer + portable executable). Linux is built on the
# oldest supported Ubuntu so the AppImage runs on Ubuntu 22.04 / Mint 21 and
# newer.

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --all --check
      - run: cargo test -p hms-desktop-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Collect installers
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb dist/
          else
            cp target/release/bundle/nsis/*.exe dist/
            # Portable: the bare executable (WebView2 is part of Windows 10 21H2+ and 11).
            cp target/release/hms-desktop.exe "dist/HMS_${GITHUB_SHA::7}_x64_portable.exe"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: hms-desktop-${{ runner.os }}
          path: desktop/dist/*
          if-no-files-found: error
